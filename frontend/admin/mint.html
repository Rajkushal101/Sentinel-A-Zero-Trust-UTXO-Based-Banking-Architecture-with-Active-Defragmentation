<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <title>Sentinel Mint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../common/api.js"></script>
    <script src="../common/secure-storage.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 850: '#151e2e' } } } } }
    </script>
</head>

<body class="bg-slate-950 text-slate-200 h-screen flex" style="display:flex">

    <!-- Sidebar (Simplified) -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-6">
        <h1 class="font-bold text-white tracking-wide mb-8">SENTINEL <span class="text-blue-500">ADMIN</span></h1>
        <a href="dashboard.html" class="block py-2 text-slate-400 hover:text-white">← Back to Dashboard</a>
    </aside>

    <main class="flex-1 p-10 flex flex-col justify-center items-center">

        <div class="w-full max-w-lg bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
            <div class="flex items-center gap-4 mb-6">
                <div class="p-3 bg-blue-600/20 text-blue-400 rounded-xl text-2xl">🏦</div>
                <div>
                    <h2 class="text-2xl font-bold text-white">Sovereign Mint</h2>
                    <p class="text-slate-500 text-sm">Issue new CBDC tokens to a wallet</p>
                </div>
            </div>

            <form onsubmit="return handleMint(event)" class="space-y-6">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1 uppercase">Recipient Username</label>
                    <input type="text" id="recipient"
                        class="w-full bg-slate-950 border border-slate-700 p-3 rounded-lg text-white focus:border-blue-500 outline-none"
                        placeholder="e.g. alice" required>
                </div>

                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1 uppercase">Amount (INR)</label>
                    <input type="number" id="amount" min="1"
                        class="w-full bg-slate-950 border border-slate-700 p-3 rounded-lg text-white focus:border-blue-500 outline-none text-2xl font-mono"
                        placeholder="0" required>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-900/20">
                    CONFIRM ISSUANCE
                </button>
            </form>

            <div id="status" class="mt-6 hidden p-4 rounded-lg text-center text-sm"></div>
        </div>

    </main>

    <script>
            // Admin Session Check
            (async function () {
                let token = null, role = null;
                if (window.secureStorage) {
                    token = await window.secureStorage.getItem('sentinel_token');
                    role = await window.secureStorage.getItem('sentinel_role');
                }
                if (!token) token = sessionStorage.getItem('sentinel_token');
                if (!role) role = sessionStorage.getItem('sentinel_role');
                if (!token || role !== 'admin') {
                    window.location.href = '../auth/login.html';
                } else {
                    document.body.style.display = 'flex';
                }
            })();

        async function getAuthHeaders() {
    let token = null, fp = null;
    if (window.secureStorage) {
        token = await window.secureStorage.getItem('sentinel_token');
        fp = await window.secureStorage.getItem('sentinel_device_fp');
    }
    if (!token) token = sessionStorage.getItem('sentinel_token');
    if (!fp) fp = sessionStorage.getItem('sentinel_device_fp');
    
    let headers = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
    };
    if (fp) headers['X-Device-Fingerprint'] = fp;
    return headers;
}

        async function handleMint(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const status = document.getElementById('status');

            const recipient = document.getElementById('recipient').value.trim();
            const amount = parseInt(document.getElementById('amount').value);

            if (!recipient || !amount || amount <= 0) {
                status.className = "mt-6 p-4 rounded-lg text-center text-sm bg-red-900/20 text-red-400 border border-red-900/50";
                status.innerText = "Please enter a valid recipient and amount.";
                status.classList.remove('hidden');
                return false;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const response = await fetch(`${API_BASE}/admin/mint`, {
                    method: 'POST',
                    headers: await getAuthHeaders(),
                    body: JSON.stringify({
                        recipient_username: recipient,
                        amount: amount
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    status.className = "mt-6 p-4 rounded-lg text-center text-sm bg-green-900/20 text-green-400 border border-green-900/50";
                    status.innerText = `✅ ${data.message || 'Minting Successful'}. TX: ${data.tx_id || ''}`;
                    status.classList.remove('hidden');
                    document.getElementById('recipient').value = '';
                    document.getElementById('amount').value = '';
                } else {
                    throw new Error(data.message || data || "Minting Failed");
                }
            } catch (err) {
                status.className = "mt-6 p-4 rounded-lg text-center text-sm bg-red-900/20 text-red-400 border border-red-900/50";
                status.innerText = "❌ " + (err.message || "Minting Error");
                status.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "CONFIRM ISSUANCE";
            }
            return false;
        }
    </script>
</body>

</html>
